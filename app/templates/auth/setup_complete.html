
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Setup Complete | StrategySim</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f3f5f8;

            font-family: Arial, Helvetica, sans-serif;

            padding: 24px;
        }

        .container {

            width: 100%;

            max-width: 460px;

            padding: 38px;

            background: #ffffff;

            border: 1px solid #e3e7ee;

            border-radius: 12px;

            text-align: center;
        }

        .brand {

            font-size: 25px;

            font-weight: 700;

            color: #173b67;

            margin-bottom: 28px;
        }

        h1 {

            font-size: 22px;

            color: #247345;

            margin-bottom: 15px;
        }

        p {

            font-size: 14px;

            color: #687386;

            line-height: 1.7;

            margin-bottom: 15px;
        }

        .account-id {

            display: inline-block;

            margin: 10px 0 20px;

            padding: 9px 14px;

            background: #f1f4f8;

            border-radius: 6px;

            color: #173b67;

            font-size: 13px;
        }

        .notice {

            font-size: 12px;

            color: #8590a0;
        }

    </style>

</head>

<body>

    <main class="container">

        <div class="brand">
            StrategySim
        </div>

        <h1>
            Administrator Created Successfully
        </h1>

        <p>

            Your initial administrator account has been
            created successfully.

            You can now proceed to the authentication
            stage of StrategySim.

        </p>

        <div class="account-id">

            Administrator ID:
            {{ administrator_id }}

        </div>

        <p class="notice">

            Keep your administrator credentials secure.

        </p>

    </main>

</body>

</html>
