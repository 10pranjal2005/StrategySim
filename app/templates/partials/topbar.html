
<header class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-slate-200 bg-white px-4 sm:px-6 lg:px-8">

    <!-- Left side -->
    <div class="flex items-center gap-3">

        <button
            type="button"
            id="sidebarToggle"
            class="rounded-lg border border-slate-200 p-2 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 lg:hidden"
            aria-label="Open navigation"
            aria-controls="appSidebar"
            aria-expanded="false">

            <svg class="h-5 w-5" fill="none" stroke="currentColor"
                 viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round"
                      stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>

        <div class="hidden text-sm text-slate-500 sm:block">
            Workspace
            <span class="mx-2 text-slate-300">/</span>
            <span class="font-medium text-slate-800">
                {% block topbar_context %}Overview{% endblock %}
            </span>
        </div>

        <div class="text-sm font-semibold text-slate-800 sm:hidden">
            StrategySim
        </div>
    </div>

    <!-- Right side -->
    <div class="flex items-center gap-3">

        <div class="hidden text-right sm:block">
            <div class="text-sm font-medium text-slate-800">
                {{ current_user.full_name }}
            </div>

            <div class="text-xs text-slate-500">
                {{ current_user.role }}
            </div>
        </div>

        <div class="flex h-9 w-9 items-center justify-center rounded-full bg-brand-50 text-sm font-semibold text-brand-700"
             aria-hidden="true">
            {{ current_user.full_name[:1]|upper }}
        </div>

        <div class="h-8 border-l border-slate-200"></div>

        <form method="POST" action="{{ url_for('auth.logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <button
                type="submit"
                class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-red-50 hover:text-red-700">

                <span class="hidden sm:inline">Sign out</span>

                <span class="sm:hidden">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor"
                         viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              stroke-width="1.8"
                              d="M10 17l5-5-5-5M15 12H3m9-9h6a2 2 0 012 2v14a2 2 0 01-2 2h-6"/>
                    </svg>
                </span>
            </button>
        </form>

    </div>

</header>
